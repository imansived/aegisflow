[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "0.1.0"
description = "Real-time cross-modal behavioral anomaly detection for connected devices"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["contracts", "backend", "simulator", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
