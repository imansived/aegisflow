[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "0.1.0"
description = "Real-time cross-modal behavioral anomaly detection for connected devices"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "redis>=5",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["contracts*", "backend*", "simulator*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the whole live system for a while (deselect with -m 'not slow')"]
