# Serves the dashboard and proxies /api to the API container. Terminate TLS in front of this (or add a
# `listen 8443 ssl` block): without TLS, tokens and telemetry cross the network in clear text.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;   # a telemetry message is well under 4 KB; this bounds request bodies at the edge

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The dashboard needs no third-party origins, so the policy allows none. Inline STYLE
    # is allowed because React sets style attributes; inline SCRIPT is not.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # WebSocket. Its URL carries the access token (browsers cannot set headers on a WebSocket), so this path
    # is NOT written to the access log.
    location = /api/ws {
        access_log off;
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # OVERWRITE, never append: a client-supplied X-Forwarded-For must not choose the address the API rate-limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000/;   # the trailing slash strips the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;   # hashed filenames: safe to cache forever
    }

    location / {
        try_files $uri /index.html;
    }
}
